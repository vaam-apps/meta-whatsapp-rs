name: CrateStack release watch

# Roadmap S12. The cratestack* crates are pinned to one minor (`~0.17.2`;
# crates/meta-whatsapp-rs/tests/cratestack_pins.rs keeps them so), and a
# minor of 0.x may break the generated code, so a new minor is one upgrade
# pull request through the review pipeline. This job only opens the issue
# that starts it: weekly, when crates.io has a newer minor than the one the
# workspace manifest pins, and no issue (open or closed) already says so.
#
# No secret is stored: the only credential is the workflow's own
# GITHUB_TOKEN, scoped to `issues: write` and `contents: read` at job level, and the job
# reads one public crates.io endpoint without a credential.

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

# No permission by default; the one job asks for its two at job level.
permissions: {}

concurrency:
  group: cratestack-release
  cancel-in-progress: false

jobs:
  watch:
    name: A new CrateStack minor opens an issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare crates.io with the pinned minor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The pinned requirement of the facade the workspace builds on.
          pinned=$(grep -E '^cratestack = \{ package = "cratestack-api"' Cargo.toml \
            | sed -E 's/.*version = "~([0-9]+\.[0-9]+)(\.[0-9]+)?".*/\1/')
          [[ "$pinned" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "no pinned minor found: '$pinned'" >&2; exit 1; }

          latest=$(curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 --proto '=https' \
            --header 'User-Agent: meta-whatsapp-rs cratestack-release-watch' \
            https://crates.io/api/v1/crates/cratestack-api \
            | jq -r '.crate.max_stable_version')
          [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected version: '$latest'" >&2; exit 1; }
          latest_minor="${latest%.*}"
          echo "pinned $pinned, latest $latest"

          # Newer by version order, not by difference: a yanked or older
          # latest must not open an issue.
          if [ "$latest_minor" = "$pinned" ] || [ "$(printf '%s\n%s\n' "$pinned" "$latest_minor" | sort -V | tail -n1)" = "$pinned" ]; then
            echo "up to date"
            exit 0
          fi

          title="CrateStack $latest_minor is released (workspace pins $pinned)"
          gh label create dependencies --color 0366d6 --description "Dependency upgrades" 2>/dev/null || true
          # An exact title match over every state, so a closed issue (decided
          # to wait for the next minor) is not reopened as a new one weekly.
          existing=$(gh issue list --state all --label dependencies --limit 200 --json title \
            | jq --arg t "$title" '[.[] | select(.title == $t)] | length')
          if [ "$existing" != "0" ]; then
            echo "an issue already says so"
            exit 0
          fi
          body="crates.io has \`cratestack-api\` $latest; the workspace pins \`~$pinned\`.

          One upgrade pull request for every \`cratestack*\` requirement (the workspace manifest and \`crates/meta-whatsapp-server-store-cratestack\`), through the review pipeline (docs/roadmap.md, S12): read the release notes for breaking changes to the schema language and the generated code, regenerate, and run \`just ci\` and \`just test-live\`. \`crates/meta-whatsapp-rs/tests/cratestack_pins.rs\` keeps them on one minor and one version."
          gh issue create --title "$title" --label dependencies --body "$body"
