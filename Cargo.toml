[workspace]
resolver = "3"
# Hexagonal layout: `meta-whatsapp-core` owns the error tree and the ports (traits);
# everything else depends on it and never the reverse. See docs/architecture.md.
members = [
  "crates/meta-whatsapp-core",
  "crates/meta-whatsapp-client",
  "crates/meta-whatsapp-webhooks",
  "crates/meta-whatsapp-adapters",
  "crates/meta-whatsapp-typst",
  "crates/meta-whatsapp-rs",
]
# Repository automation is its own workspace (own Cargo.lock): its HTTP
# client (ureq → rustls with `ring`) must not be resolved into the
# library's builds and tests. See .xtask/Cargo.toml.
exclude = [".xtask"]
default-members = [
  "crates/meta-whatsapp-core",
  "crates/meta-whatsapp-client",
  "crates/meta-whatsapp-webhooks",
  "crates/meta-whatsapp-adapters",
  "crates/meta-whatsapp-typst",
  "crates/meta-whatsapp-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Equal to the pinned toolchain on purpose: the brief is "latest stable", and
# typst 0.15 (1.92) and sqlx 0.9 (1.94) already sit close to it.
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/vaam-apps/meta-whatsapp-rs"
authors = ["Vymalo"]
# The crate names were free on crates.io on 2026-09-25 (OPEN_QUESTIONS #1,
# closed), but nothing is published until a release is decided.
publish = false

[workspace.dependencies]
# Internal crates.
meta-whatsapp-core = { path = "crates/meta-whatsapp-core" }
meta-whatsapp-client = { path = "crates/meta-whatsapp-client" }
meta-whatsapp-webhooks = { path = "crates/meta-whatsapp-webhooks" }
# default-features off here so the facade can choose; members that want the
# defaults name the features they use.
meta-whatsapp-adapters = { path = "crates/meta-whatsapp-adapters", default-features = false }
meta-whatsapp-typst = { path = "crates/meta-whatsapp-typst" }

# Errors. `thiserror` shapes the typed tree; `anyhow` is the opaque leaf for
# failures an adapter or integrator raises that have no typed home.
anyhow = "1"
thiserror = "2"

# Serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async plumbing.
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", default-features = false }
tokio-stream = "0.1"

# HTTP vocabulary shared by every transport.
bytes = "1"
http = "1"
url = { version = "2", features = ["serde"] }

# Secrets and time.
secrecy = "0.10"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

# Crypto. RustCrypto's digest-0.10 generation for HMAC/SHA-2/AES-GCM.
# RSA-OAEP (Flows data endpoint) uses aws-lc-rs, not `rsa`: `rsa` 0.9 carries
# RUSTSEC-2023-0071 (Marvin timing side channel) with no fixed release, and a
# Flows endpoint decrypts attacker-supplied ciphertext by design.
hmac = "0.12"
sha2 = "0.10"
# `zeroize` wipes the expanded key schedule on drop (token vault, Flows).
aes-gcm = { version = "0.10", features = ["zeroize"] }
aws-lc-rs = "1"
subtle = "2"
getrandom = "0.3"
hex = "0.4"
base64 = "0.22"

# Observability.
tracing = "0.1"

# Unicode general categories (the OTP namespace refuses format characters).
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }

# Adapters (optional behind features in meta-whatsapp-adapters / meta-whatsapp-webhooks).
reqwest = { version = "0.13", default-features = false }
axum = { version = "0.8", default-features = false }
sqlx = { version = "0.9", default-features = false }
redis = { version = "1", default-features = false }

# Typst rendering.
typst = "0.15"
# `PagedDocument` (what `typst::compile` lays out and every exporter takes)
# lives here and is not re-exported by `typst`.
typst-layout = "0.15"
typst-pdf = "0.15"
typst-render = "0.15"
typst-assets = "0.15"

# Dev.
# Examples only: makes the library's `tracing` output visible (RUST_LOG).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
pretty_assertions = "1"
tower = "0.5"
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every public fallible function returns the crate `Result`; its variants are
# the documentation. A per-fn `# Errors` section would restate them.
missing_errors_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
# Graph error codes and ids are written exactly as Meta's docs print them
# (`131047`, not `131_047`) so a grep for a code finds its handling.
unreadable_literal = "allow"
# Library code never panics on input it did not construct itself.
unwrap_used = "warn"
expect_used = "warn"
