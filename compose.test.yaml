# Services for `just test-live`. Non-default host ports so a developer's own
# Postgres/Redis/MongoDB are never touched.
name: meta-whatsapp-rs-test
services:
  # TLS on (roadmap S10: the `sslmode=require` case of the service's
  # tests/tls.rs), with the test-only server certificate of
  # tools/test-tls/generate.sh; plain connections are still accepted.
  # Postgres refuses a key file others can read, and the mounted one is
  # world-readable on purpose (see the generator), so the entrypoint copies
  # the pair to the server user's own directory, the key 0600, first.
  postgres:
    image: postgres:18-alpine
    entrypoint:
      - sh
      - -c
      - >-
        install -d -o postgres -g postgres -m 0700 /var/lib/postgresql/tls &&
        install -o postgres -g postgres -m 0600 /tls/server.key /var/lib/postgresql/tls/server.key &&
        install -o postgres -g postgres -m 0644 /tls/server.crt /var/lib/postgresql/tls/server.crt &&
        exec docker-entrypoint.sh postgres -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/tls/server.crt
        -c ssl_key_file=/var/lib/postgresql/tls/server.key
    environment:
      POSTGRES_USER: wa
      POSTGRES_PASSWORD: wa
      POSTGRES_DB: wa
    volumes: ["./.test-tls:/tls:ro"]
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wa -d wa"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  # `rediss://` (roadmap L21c): TLS only, and a client certificate required
  # (`tls-auth-clients yes`, Redis' own default). The certificates are
  # test-only, written to .test-tls/ by tools/test-tls/generate.sh, which
  # `just test-live` runs before `up`.
  redis-tls:
    image: redis:8-alpine
    command:
      - redis-server
      - --port
      - "0"
      - --tls-port
      - "6380"
      - --tls-cert-file
      - /tls/server.crt
      - --tls-key-file
      - /tls/server.key
      - --tls-ca-cert-file
      - /tls/ca.crt
      - --tls-auth-clients
      - "yes"
    volumes: ["./.test-tls:/tls:ro"]
    ports: ["127.0.0.1:56380:6380"]
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "-p", "6380", "--cacert", "/tls/ca.crt", "--cert", "/tls/client.crt", "--key", "/tls/client.key", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  # MongoDB (roadmap S8): a single-node replica set, as multi-document
  # transactions need one. The set's one member is `localhost:27017`, its
  # address inside the container; `directConnection=true` in the test URL
  # keeps the driver on the address it was given (127.0.0.1:57017 here,
  # mongodb:27017 in the devcontainer) rather than on that member address,
  # which only the container itself can reach. The healthcheck initiates
  # the set on its first run (`rs.status()` throws NotYetInitialized, code
  # 94, until then) and passes once this member is primary. Each check
  # starts a mongosh (about a second of CPU), so it runs every second only
  # until the first pass (`start_interval`, Docker Engine 25+; an older
  # engine uses `interval` throughout, and is just slower to report
  # healthy), then every 30 s, not every 2 s through the whole test run.
  mongodb:
    image: mongo:7.0.45-jammy
    command: ["mongod", "--replSet", "rs0"]
    ports: ["127.0.0.1:57017:27017"]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) { if (e.code !== 94) throw e;
          rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }) }
          quit(db.hello().isWritablePrimary ? 0 : 1)
      start_period: 60s
      start_interval: 1s
      interval: 30s
      timeout: 10s
      retries: 3
