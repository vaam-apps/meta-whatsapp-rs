[package]
name = "meta-whatsapp-core"
description = "Error tree, identifiers and ports (transport, storage, sink, clock) shared by every meta-whatsapp-rs crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# `ScriptedTransport` and friends: deterministic, network-free doubles for the
# ports. Every crate's unit tests use them; integrators may too.
testing = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
http.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
url.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
