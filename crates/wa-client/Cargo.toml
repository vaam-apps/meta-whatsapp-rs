[package]
name = "wa-client"
description = "Typed client for Meta's WhatsApp Business Platform (Cloud API, Business Management API, Embedded Signup, MM API)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# Flows data-endpoint crypto (RSA-OAEP-SHA256 + AES-128-GCM) via aws-lc-rs,
# which builds a C library; opt-in so the default build stays pure Rust.
flows-endpoint = ["dep:aws-lc-rs"]

[dependencies]
wa-core.workspace = true
aws-lc-rs = { workspace = true, optional = true }

aes-gcm.workspace = true
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
unicode-properties.workspace = true
url.workspace = true

[dev-dependencies]
wa-core = { workspace = true, features = ["testing"] }
wa-adapters = { workspace = true, features = ["memory"] }
# Test doubles of the KvStore port (OTP, vault and session tests).
async-trait.workspace = true
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
