[package]
name = "wa-adapters"
description = "Adapters for the wa-core ports: reqwest transport, memory/Postgres/Redis stores, event sinks and streams."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["memory", "sinks"]
# In-memory KvStore + ConversationStore. Single process; tests and dev.
memory = ["tokio/sync"]
# reqwest-based HttpTransport (rustls).
reqwest = ["dep:reqwest"]
# Postgres KvStore + ConversationStore (sqlx), with embedded migrations.
postgres = ["dep:sqlx"]
# Redis KvStore.
redis = ["dep:redis"]
# Channel, broadcast, fan-out, fn and tracing sinks, and event streams.
sinks = ["tokio/sync", "dep:tokio-stream"]

[dependencies]
wa-core.workspace = true

anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-stream = { workspace = true, optional = true }
tracing.workspace = true
url.workspace = true

reqwest = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
redis = { workspace = true, optional = true }

[dev-dependencies]
wa-core = { workspace = true, features = ["testing"] }
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
