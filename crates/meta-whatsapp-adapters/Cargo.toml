[package]
name = "meta-whatsapp-adapters"
description = "Adapters for the meta-whatsapp-core ports: reqwest transport, memory/Postgres/Redis stores, event sinks and streams."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["memory", "sinks"]
# In-memory KvStore + ConversationStore. Single process; tests and dev.
memory = ["tokio/sync"]
# reqwest-based HttpTransport (rustls with the aws-lc-rs provider, the same
# crypto crate the workspace already uses for RSA-OAEP).
reqwest = ["dep:reqwest"]
# Postgres KvStore + ConversationStore (sqlx), with embedded migrations.
postgres = ["dep:sqlx", "dep:serde"]
# Redis KvStore, over `redis://` or `rediss://` (TLS: rustls with an
# explicit aws-lc-rs provider, never the process default; roadmap L21c).
redis = [
  "dep:redis",
  "dep:rustls",
  "dep:tokio-rustls",
  "dep:rustls-platform-verifier",
  "dep:url",
  "tokio/net",
  "tokio/rt",
  "tokio/sync",
]
# Channel, broadcast, fan-out, filter, fn and tracing sinks, and event streams.
sinks = ["tokio/sync", "dep:tokio-stream"]

[dependencies]
meta-whatsapp-core.workspace = true

anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
http.workspace = true
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-stream = { workspace = true, optional = true, features = ["sync"] }
tracing.workspace = true

# `stream` for true streaming in both directions, `multipart` for media
# upload, `http2` because graph.facebook.com negotiates it. No default
# features: no system-proxy discovery or charset sniffing we do not use.
reqwest = { workspace = true, optional = true, features = ["rustls", "stream", "multipart", "http2"] }
# Postgres: `serde::de::Error::custom`, so a stored column that does not
# decode is `StorageError::Corrupt` (whose source is a `serde_json::Error`).
serde = { workspace = true, optional = true }
# `macros` only for `sqlx::migrate!` (embedding); every query is a runtime
# query, so building never needs DATABASE_URL. TLS uses aws-lc-rs to match
# reqwest, so one crypto provider serves both.
sqlx = { workspace = true, optional = true, features = [
  "runtime-tokio",
  "postgres",
  "tls-rustls-aws-lc-rs",
  "migrate",
  "macros",
  "time",
  "json",
] }
# No TLS feature of redis: redis-rs builds its rustls configuration with
# `rustls::ClientConfig::builder()`, the process-default crypto provider,
# which panics when reqwest's aws-lc-rs and another crate's ring are both
# linked and the application installed none. `rediss://` is ours instead
# (`store::RedisTls`): the handshake is done here, with the provider chosen
# explicitly, and the stream handed to redis-rs.
redis = { workspace = true, optional = true, features = ["tokio-comp", "connection-manager", "script"] }
# `aws_lc_rs` (the provider reqwest and sqlx already use here), `std`, and
# `tls12` (managed Redis offerings still accept TLS 1.2). No `logging`.
rustls = { workspace = true, optional = true, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { workspace = true, optional = true }
# The platform's trust store by default, as reqwest's transport does.
rustls-platform-verifier = { workspace = true, optional = true }
# `rediss://` is parsed here: redis-rs refuses the scheme without its TLS
# features.
url = { workspace = true, optional = true }

[dev-dependencies]
meta-whatsapp-core = { workspace = true, features = ["testing"] }
# `http2`: the body bound is tested over h2c (prior knowledge) too.
axum = { workspace = true, features = ["http1", "http2", "tokio", "multipart", "json"] }
# tests/reqwest_transport.rs builds requests with them.
bytes.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util", "net", "io-util", "sync"] }
url.workspace = true
# tests/redis_tls*.rs: rustls with its `ring` provider as well, so those test
# binaries link both providers: the case in which the process default is
# ambiguous and `rustls::ClientConfig::builder()` panics (roadmap L21c). A
# dev-dependency only: no library build links ring.
rustls = { workspace = true, features = ["ring", "aws_lc_rs", "std", "tls12"] }

[lints]
workspace = true
