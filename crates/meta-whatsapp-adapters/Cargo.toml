[package]
name = "meta-whatsapp-adapters"
description = "Adapters for the meta-whatsapp-core ports: reqwest transport, memory/Postgres/SQLite/Redis stores, event sinks and streams."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["memory", "sinks"]
# In-memory KvStore + ConversationStore. Single process; tests and dev.
memory = ["tokio/sync"]
# reqwest-based HttpTransport (rustls with the aws-lc-rs provider, the same
# crypto crate the workspace already uses for RSA-OAEP).
reqwest = ["dep:reqwest"]
# Postgres KvStore + ConversationStore (sqlx), with embedded migrations.
# sqlx's Postgres driver, its TLS and its macros are enabled here, not on the
# dependency, so that `sqlite` alone links neither.
postgres = [
  "dep:sqlx",
  "dep:serde",
  "sqlx/postgres",
  "sqlx/tls-rustls-aws-lc-rs",
  "sqlx/macros",
]
# SQLite KvStore + ConversationStore (sqlx's SQLite driver, the SQLite library
# bundled and compiled in: nothing to install), with embedded migrations
# (roadmap L8). No TLS: the database is a local file.
sqlite = ["dep:sqlx", "dep:serde", "sqlx/sqlite-bundled"]
# Redis KvStore + ConversationStore, over `redis://` or `rediss://` (TLS:
# rustls with an explicit aws-lc-rs provider, never the process default;
# roadmap L21c).
redis = [
  "dep:redis",
  "dep:serde",
  "dep:rustls",
  "dep:tokio-rustls",
  "dep:rustls-platform-verifier",
  "dep:url",
  "tokio/net",
  "tokio/rt",
  "tokio/sync",
]
# Channel, broadcast, fan-out, filter, fn and tracing sinks, and event streams.
sinks = ["tokio/sync", "dep:tokio-stream"]
# `media::FfmpegConverter`: core's `MediaConverter` port over an `ffmpeg`
# binary the integrator installs, run as a child process. Nothing is linked
# or bundled: no codec library enters the build.
ffmpeg = ["dep:bytes", "tokio/process", "tokio/io-util"]

[dependencies]
meta-whatsapp-core.workspace = true

anyhow.workspace = true
async-trait.workspace = true
bytes = { workspace = true, optional = true }
futures.workspace = true
http.workspace = true
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-stream = { workspace = true, optional = true, features = ["sync"] }
tracing.workspace = true

# `stream` for true streaming in both directions, `multipart` for media
# upload, `http2` because graph.facebook.com negotiates it. No default
# features: no system-proxy discovery or charset sniffing we do not use.
reqwest = { workspace = true, optional = true, features = ["rustls", "stream", "multipart", "http2"] }
# Postgres, SQLite, Redis: `serde::de::Error::custom`, so a stored column or
# field that does not decode is `StorageError::Corrupt` (whose source is a
# `serde_json::Error`).
serde = { workspace = true, optional = true }
# The drivers are the `postgres` and `sqlite` features' (above). `macros`
# (the `postgres` feature's) only for `sqlx::migrate!` (embedding the
# Postgres migrations; the SQLite ones are embedded with `include_str!`);
# every query is a runtime query, so building never needs DATABASE_URL.
# Postgres' TLS uses aws-lc-rs to match reqwest, so one crypto provider
# serves both.
sqlx = { workspace = true, optional = true, features = [
  "runtime-tokio",
  "migrate",
  "time",
  "json",
] }
# No TLS feature of redis: redis-rs builds its rustls configuration with
# `rustls::ClientConfig::builder()`, the process-default crypto provider,
# which panics when reqwest's aws-lc-rs and another crate's ring are both
# linked and the application installed none. `rediss://` is ours instead
# (`store::RedisTls`): the handshake is done here, with the provider chosen
# explicitly, and the stream handed to redis-rs.
redis = { workspace = true, optional = true, features = ["tokio-comp", "connection-manager", "script"] }
# `aws_lc_rs` (the provider reqwest and sqlx already use here), `std`, and
# `tls12` (managed Redis offerings still accept TLS 1.2). No `logging`.
rustls = { workspace = true, optional = true, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { workspace = true, optional = true }
# The platform's trust store by default, as reqwest's transport does.
rustls-platform-verifier = { workspace = true, optional = true }
# `rediss://` is parsed here: redis-rs refuses the scheme without its TLS
# features.
url = { workspace = true, optional = true }

[dev-dependencies]
meta-whatsapp-core = { workspace = true, features = ["testing"] }
# `http2`: the body bound is tested over h2c (prior knowledge) too.
axum = { workspace = true, features = ["http1", "http2", "tokio", "multipart", "json"] }
# tests/reqwest_transport.rs builds requests with them.
bytes.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util", "net", "io-util", "sync"] }
url.workspace = true
# tests/redis_tls*.rs: rustls with its `ring` provider as well, so those test
# binaries link both providers: the case in which the process default is
# ambiguous and `rustls::ClientConfig::builder()` panics (roadmap L21c). A
# dev-dependency only: no library build links ring.
rustls = { workspace = true, features = ["ring", "aws_lc_rs", "std", "tls12"] }
# tests/redis_tls_handshake.rs: its servers' certificates, made per test on
# aws-lc-rs (none is committed).
rcgen = { workspace = true, features = ["aws_lc_rs", "pem"] }
# tests/live_mongodb.rs (roadmap S8): a multi-document transaction against
# the test replica set. A dev-dependency only, until S17's `mongodb` feature.
# The driver requires a TLS feature: `rustls-tls-aws-lc` builds its rustls
# configuration with an explicit aws-lc-rs provider (not `rustls-tls`, which
# is `ring`); the test server itself is plain. `compat-3-3-0` is required by
# the driver; `bson-3` picks the current bson.
mongodb = { workspace = true, features = ["compat-3-3-0", "bson-3", "rustls-tls-aws-lc"] }

[lints]
workspace = true
