[package]
name = "wa-rs"
description = "WhatsApp Business Platform for Rust: client, webhooks, adapters and Typst rendering behind one dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "wa_rs"

[features]
default = ["reqwest", "memory", "sinks"]
reqwest = ["wa-adapters/reqwest"]
memory = ["wa-adapters/memory"]
sinks = ["wa-adapters/sinks"]
postgres = ["wa-adapters/postgres"]
redis = ["wa-adapters/redis"]
axum = ["wa-webhooks/axum"]
typst = ["dep:wa-typst"]
flows-endpoint = ["wa-client/flows-endpoint"]
full = ["reqwest", "memory", "sinks", "postgres", "redis", "axum", "typst", "flows-endpoint"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde_json.workspace = true
time.workspace = true
tracing.workspace = true
wa-core.workspace = true
wa-client.workspace = true
wa-webhooks.workspace = true
wa-adapters = { workspace = true, default-features = false }
wa-typst = { workspace = true, optional = true }

[dev-dependencies]
wa-core = { workspace = true, features = ["testing"] }
wa-adapters = { workspace = true, features = ["memory"] }
serde_json.workspace = true
# Examples and the in-process app test.
anyhow.workspace = true
axum = { workspace = true, features = ["http1", "tokio", "json", "query"] }
http-body-util.workspace = true
pretty_assertions.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time"] }
tower = { workspace = true, features = ["util"] }
# `cms_inbox` and `embedded_signup` build a `PgPool` when DATABASE_URL is set
# (feature `postgres`). No features here: `wa-adapters/postgres` turns on the
# ones the pool needs, and without it the examples never touch sqlx.
sqlx.workspace = true

# Examples. `required-features` keeps `cargo check -p wa-rs --examples` (default
# features) green; `--all-features` (what `just check` and `just lint` use)
# builds all of them.
[[example]]
name = "send_message"
required-features = ["reqwest"]

[[example]]
name = "otp_login"
required-features = ["reqwest", "memory"]

[[example]]
name = "cms_inbox"
required-features = ["reqwest", "memory", "sinks", "axum"]

[[example]]
name = "embedded_signup"
required-features = ["reqwest", "memory", "axum"]

[[example]]
name = "invoice_document"
required-features = ["reqwest", "typst"]

[lints]
workspace = true
