[package]
name = "meta-whatsapp-server-core"
description = "The meta-whatsapp-rs service's domain, framework-free: records, API keys, event routing and polling, idempotency, rate limits, the error model as data, authorization, and the ports a backend implements."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Part of the service (crates/meta-whatsapp-server), never a library
# dependency: no crate of the library depends on it.
publish = false

[lib]
name = "meta_whatsapp_server_core"

[features]
# `meta_whatsapp_server_core::conformance`: the executable definition of the
# ports' contracts, which every backend runs over its `Backend` (the
# service's memory and Postgres ones in its tests; yours in your own), as
# the library's `meta_whatsapp_adapters::store::conformance` is for a
# `KvStore`. Test code: it panics on a broken contract, and brings the
# library's `ScriptedTransport` (the capabilities' Graph client) and
# tokio's `join!`.
conformance = ["meta-whatsapp-rs/testing", "tokio/macros"]

[dependencies]
# The library, through the facade and without its adapters: no HTTP
# framework (axum), no database driver (sqlx), no HTTP client (reqwest)
# (docs/architecture.md, § Service). What a backend or an API adapter
# needs beyond it, it brings itself.
# The Flows data endpoint's crypto (RSA-OAEP, AES-GCM; roadmap M5d) is the
# library's `flows-endpoint` feature.
meta-whatsapp-rs = { workspace = true, features = ["flows-endpoint"] }

# The library's `SinkError::Delivery` carries an `anyhow::Error`: the webhook
# pipeline's sink wraps a storage failure in one (src/inbound.rs). Already
# the library's dependency.
anyhow.workspace = true
# Webhook endpoints' signing secrets, sealed under `WA_SERVER_DATA_KEY`
# (src/webhooks_out/seal.rs; design section 4.4). Already the library's
# dependency (the token vault's cipher).
aes-gcm.workspace = true
async-trait.workspace = true
# Meta reports a media file's SHA-256 in hex or base64 (src/media.rs).
base64.workspace = true
# A media download's chunks, the library's own type, passed on as they
# arrive (src/media.rs: `MediaStream`). Already the library's dependency.
bytes.workspace = true
# Attaching a WABA follows Meta's listing of its numbers, a stream.
futures.workspace = true
# Random API keys and idempotency claim ids.
getrandom.workspace = true
# Event ids and outbox keys, in hex.
hex.workspace = true
# Event ids: a keyed hash of the event's outbox key.
hmac.workspace = true
# The requests' Meta objects are read into the library's types and written
# back (`request::meta_object`).
serde.workspace = true
serde_json.workspace = true
# API keys are stored as SHA-256 digests and compared in constant time.
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
# The rate limiter's buckets and the transfer slots; an idempotency key
# cut before it settled is settled from a task of its own; a live event
# stream's task waits on its wake-ups, its timers and its shutdown at once
# (`select!`, src/live.rs).
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tracing.workspace = true
# A webhook endpoint's URL, parsed as WHATWG does (an IPv4 host in hex or
# octal read as the address it is) before the allow-list checks it
# (src/webhooks_out/destination.rs). Already the library's dependency.
url.workspace = true
# Meta's `details` lose format characters and line separators, not only
# control characters (src/error.rs).
unicode-properties.workspace = true

[dev-dependencies]
# tests/memory: the library's memory conversation store, the inbox of the
# webhook pipeline's suite (`conformance::webhooks`). Test builds only.
meta-whatsapp-rs = { workspace = true, features = ["memory"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync", "test-util"] }
# tests/visibility.rs: what does not compile outside this crate.
trybuild.workspace = true

[lints]
workspace = true
