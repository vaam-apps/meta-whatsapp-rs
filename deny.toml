# cargo-deny configuration. `just deny` / `just ci`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained-crate advisories count only for our direct dependencies. typst
# pulls unmaintained transitive crates (bincode, paste, rustybuzz, ttf-parser,
# yaml-rust at the time of writing) that we cannot replace short of forking
# typst. Vulnerability advisories are not affected by this: they still fail
# the check for any crate in the graph.
unmaintained = "workspace"
# quick-xml 0.38 DoS advisories, reached only through typst-library →
# hayagriva → citationberg (CSL citation styles); no patched citationberg
# release exists yet. Exposure: typst parses CSL only for `bibliography` /
# `cite(style: ..)`. meta-whatsapp-typst templates are trusted integrator code, inputs
# arrive as JSON, the World refuses file reads, and meta-whatsapp-typst is an opt-in
# feature. Both advisories need attacker-controlled XML. Remove these ignores
# as soon as typst ships citationberg on quick-xml >= 0.41.
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "quick-xml via typst CSL parsing; templates are trusted, no untrusted XML reaches it" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml via typst CSL parsing; templates are trusted, no untrusted XML reaches it" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "0BSD",
  # Fonts bundled by typst-assets (OFL) — rendered output only.
  "OFL-1.1",
  "MIT-0",
  # Owner's decision of 2026-11-02: for tiny-keccak through the mongodb driver (roadmap S9, S17).
  "CC0-1.0",
]

# BlueOak-1.0.0 for these two crates only, never in `allow`: the owner's
# decision of 2026-11-02 (design D20 (a): yes), roadmap S10. Both are
# non-optional dependencies of CrateStack's crates (cratestack-axum,
# cratestack-codec-cbor, cratestack-client-rust), which the service's
# CrateStack API adapter, meta-whatsapp-server-api-cratestack, brings in.
[[licenses.exceptions]]
crate = "minicbor"
allow = ["BlueOak-1.0.0"]

[[licenses.exceptions]]
crate = "minicbor-serde"
allow = ["BlueOak-1.0.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
