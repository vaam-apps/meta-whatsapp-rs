# Dev container services. `dev` is where you (and Claude Code) work; the
# sidecars back `just test-live` (META_WHATSAPP_RS_TEST_* point at them).
name: meta-whatsapp-rs-dev
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TZ: ${TZ:-UTC}
        CLAUDE_CODE_VERSION: latest
    command: sleep infinity
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ..:/workspace:cached
      - claude-code-bashhistory:/commandhistory
      - claude-code-config:/home/node/.claude
      - cargo-registry:/home/node/.cargo/registry
      - cargo-git:/home/node/.cargo/git
    environment:
      CLAUDE_CONFIG_DIR: /home/node/.claude
      NODE_OPTIONS: --max-old-space-size=4096
      POWERLEVEL9K_DISABLE_GITSTATUS: "true"
      META_WHATSAPP_RS_TEST_POSTGRES_URL: postgres://wa:wa@postgres:5432/wa
      META_WHATSAPP_RS_TEST_REDIS_URL: redis://redis:6379
      # `rediss://` (roadmap L21c): the redis-tls sidecar, and the test-only
      # files devcontainer.json's initializeCommand writes to .test-tls/.
      META_WHATSAPP_RS_TEST_REDISS_URL: rediss://redis-tls:6380
      META_WHATSAPP_RS_TEST_REDISS_CA: /workspace/.test-tls/ca.crt
      META_WHATSAPP_RS_TEST_REDISS_CLIENT_CERT: /workspace/.test-tls/client.crt
      META_WHATSAPP_RS_TEST_REDISS_CLIENT_KEY: /workspace/.test-tls/client.key
      # The mongodb sidecar's single-node replica set (roadmap S8);
      # `directConnection=true` because the set's member address is the
      # sidecar's own `localhost`.
      META_WHATSAPP_RS_TEST_MONGODB_URL: mongodb://mongodb:27017/?directConnection=true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redis-tls: { condition: service_healthy }
      mongodb: { condition: service_healthy }
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wa
      POSTGRES_PASSWORD: wa
      POSTGRES_DB: wa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wa -d wa"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  # As compose.test.yaml's: TLS only, client certificates required, the
  # test-only certificates of tools/test-tls/generate.sh.
  redis-tls:
    image: redis:8-alpine
    command:
      - redis-server
      - --port
      - "0"
      - --tls-port
      - "6380"
      - --tls-cert-file
      - /tls/server.crt
      - --tls-key-file
      - /tls/server.key
      - --tls-ca-cert-file
      - /tls/ca.crt
      - --tls-auth-clients
      - "yes"
    volumes:
      - ../.test-tls:/tls:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "-p", "6380", "--cacert", "/tls/ca.crt", "--cert", "/tls/client.crt", "--key", "/tls/client.key", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  # As compose.test.yaml's (see there): a single-node replica set whose
  # healthcheck initiates it once and passes when this member is primary.
  mongodb:
    image: mongo:7.0.45-jammy
    command: ["mongod", "--replSet", "rs0"]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) { if (e.code !== 94) throw e;
          rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] }) }
          quit(db.hello().isWritablePrimary ? 0 : 1)
      start_period: 60s
      start_interval: 1s
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  claude-code-bashhistory:
  claude-code-config:
  cargo-registry:
  cargo-git:
